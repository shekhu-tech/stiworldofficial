                    { name: 'Lip Sync', price: '₹299', img: 'https://images.unsplash.com/photo-1520110120835-c96534a4c984?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Mini Vlog', price: '₹499', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },

                ]
            }, {
                id: 'educational',
                name: 'Educational',
                icon: 'fa-graduation-cap',
                image: 'tweletwele.png',
                subcategories: [
                    { name: 'Science Explainers', price: '₹1499', img: 'https://images.unsplash.com/photo-1532094349884-543bc11b234d?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'History', price: '₹1299', img: 'https://images.unsplash.com/photo-1599839619722-39751411ea63?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Math Tutorials', price: '₹999', img: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Kids Learning', price: '₹799', img: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'romance',
                name: 'Love / Romance',
                icon: 'fa-heart',
                image: 'thirteenthirteen.png',
                subcategories: [
                    { name: 'Pre‑Wedding', price: '₹3499', img: 'https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Anniversary', price: '₹1499', img: 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Proposal', price: '₹1999', img: 'https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Romantic Shayari', price: '₹999', img: 'https://images.unsplash.com/photo-1516726817505-f5ed825624d8?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'comedy',
                name: 'Comedy / Funny',
                icon: 'fa-face-laugh-squint',
                image: 'fourteenfourteen.png',
                subcategories: [
                    { name: 'Standup', price: '₹899', img: 'https://images.unsplash.com/photo-1585699324551-f6c309eedeca?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Prank', price: '₹999', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Meme', price: '₹499', img: 'https://images.unsplash.com/photo-1531256456869-ce942c665c70?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Dubbing', price: '₹799', img: 'https://images.unsplash.com/photo-1516280440502-8610eb675c96?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'advertisement',
                name: 'Ad / Promo',
                icon: 'fa-bullhorn',
                image: 'fifteenfifteen.png',
                subcategories: [
                    { name: 'Sale Offer', price: '₹1499', img: 'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Brand Teaser', price: '₹2499', img: 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Event Promo', price: '₹1999', img: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Product Launch', price: '₹3499', img: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }];

            // Projects with videoId — clicking plays the video
            const projects = [{
                title: 'Cyberpunk 2077 Teaser',
                category: 'Animation',
                img: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }, {
                title: 'Brand Launch: NEXUS',
                category: 'Ad / Promo',
                img: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }, {
                title: 'Motivation: "Unstoppable"',
                category: 'Motivation',
                img: 'https://images.unsplash.com/photo-1552581234-26160f608093?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }, {
                title: 'Horror Short: "Echoes"',
                category: 'Horror',
                img: 'https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }, {
                title: 'Historical: "Spartan Rise"',
                category: 'Historical',
                img: 'https://images.unsplash.com/photo-1622322384735-86f78e4785bc?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }, {
                title: 'Real Estate Walkthrough',
                category: 'Corporate',
                img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=400&auto=format&fit=crop',
                videoId: 'dQw4w9WgXcQ'
            }];

            // ===== RENDER =====
            const grid = document.getElementById('category-grid');
            categories.forEach((cat, idx) => {
                const card = document.createElement('button');
                card.className =
                    `glass-card rounded-2xl p-3 flex items-center gap-4 w-full text-left transition-all duration-300 hover:scale-[1.02]`;
                card.style.animationDelay = `${idx * 40}ms`;
                card.innerHTML = `
                        <div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0 bg-black/40 border border-gold/20">
                            <img src="${cat.image}" alt="${cat.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-playfair font-bold text-white/95 text-base truncate">${cat.name}</h3>
                            <div class="flex items-center gap-2 text-xs text-gold/50 mt-0.5 font-montserrat font-medium">
                                <i class="fa-solid ${cat.icon} text-gold/60"></i>
                                <span>${cat.subcategories.length} styles</span>
                            </div>
                        </div>
                        <i class="fa-regular fa-chevron-right text-gold/30 text-sm"></i>
                    `;
                card.addEventListener('click', () => openModal(cat.id));
                grid.appendChild(card);
            });

            // projects - click to play video
            const projectGrid = document.getElementById('project-grid');
            projects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'project-card rounded-2xl overflow-hidden group relative';
                div.innerHTML = `
                        <div class="relative h-44 overflow-hidden">
                            <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                            <div class="project-play-overlay">
                                <i class="fa-regular fa-circle-play"></i>
                            </div>
                            <div class="absolute bottom-3 left-3 right-3">
                                <span class="chip-gold text-[10px] font-montserrat font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">${p.category}</span>
                                <h4 class="text-white font-playfair font-bold text-sm mt-1.5 truncate">${p.title}</h4>
                            </div>
                        </div>
                    `;
                // Click on project card opens video modal
                div.addEventListener('click', () => {
                    openVideoModal(p.videoId || defaultVideoId, p.title);
                });
                projectGrid.appendChild(div);
            });

            // ===== MODAL LOGIC =====
            const modalContainer = document.getElementById('modal-container');
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalContent = document.getElementById('modal-content');
            const closeModalBtn = document.getElementById('close-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalIcon = document.getElementById('modal-icon');
            const subList = document.getElementById('subcategory-list');

            const videoModalContainer = document.getElementById('video-modal-container');
            const videoModalBackdrop = document.getElementById('video-modal-backdrop');
            const videoModalContent = document.getElementById('video-modal-content');
            const closeVideoBtn = document.getElementById('close-video-modal');
            const youtubeIframe = document.getElementById('youtube-iframe');
            const videoModalTitle = document.getElementById('video-modal-title');

            window.openModal = (categoryId) => {
                const cat = categories.find(c => c.id === categoryId);
                if (!cat) return;
                modalTitle.textContent = cat.name;
                modalIcon.innerHTML = `<i class="fa-solid ${cat.icon} text-gold text-lg"></i>`;

                subList.innerHTML = cat.subcategories.map((sub, i) => `
                        <button class="sub-card rounded-xl p-3 flex items-center gap-3 w-full text-left transition-all" onclick="openVideoModal('${sub.videoId}', '${sub.name}')" style="animation-delay:${i*20}ms">
                            <div class="w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 bg-black/50 border border-gold/10">
                                <img src="${sub.img}" alt="${sub.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-white/90 font-playfair font-bold text-sm truncate">${sub.name}</h4>
                                <span class="text-[11px] text-gold/50 font-montserrat font-medium">${sub.price}</span>
                            </div>
                            <i class="fa-regular fa-play text-gold/40 text-xs"></i>
                        </button>
                    `).join('');

                modalContainer.classList.remove('hidden');
                requestAnimationFrame(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                });
            };

            const closeModal = () => {
                modalContent.classList.remove('scale-100', 'opacity-100');
                modalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modalContainer.classList.add('hidden'), 300);
            };

            window.openVideoModal = (videoId, title) => {
                videoModalTitle.textContent = title || 'video';
                youtubeIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
                videoModalContainer.classList.remove('hidden');
                requestAnimationFrame(() => {
                    videoModalContent.classList.remove('scale-95', 'opacity-0');
                    videoModalContent.classList.add('scale-100', 'opacity-100');
                });
            };

            const closeVideoModal = () => {
                videoModalContent.classList.remove('scale-100', 'opacity-100');
                videoModalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    videoModalContainer.classList.add('hidden');
                    youtubeIframe.src = '';
                }, 300);
            };

            closeModalBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);
            closeVideoBtn.addEventListener('click', closeVideoModal);
            videoModalBackdrop.addEventListener('click', closeVideoModal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!videoModalContainer.classList.contains('hidden')) closeVideoModal();
                    else if (!modalContainer.classList.contains('hidden')) closeModal();
                }
            });
        })();
    </script>
</body>
</html>
