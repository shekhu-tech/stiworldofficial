<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.03) 0%, transparent 50%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            padding-top: 80px;
            padding-bottom: 120px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- DARK GOLDEN SHINING CARDS (Category & Sub) ----- */
        .category-card, .sub-card {
            background: linear-gradient(145deg, rgba(30, 25, 10, 0.85), rgba(15, 12, 5, 0.95));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            border-radius: 16px;
            display: flex;
            align-items: stretch;
            text-align: left;
            width: 100%;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,215,0,0.05);
            height: 128px;
            min-height: 110px;
        }
        .sub-card {
            height: 110px;
            min-height: 96px;
        }
        .category-card::before, .sub-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 1;
        }
        .category-card:hover::before, .sub-card:hover::before {
            opacity: 1;
        }
        .category-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: linear-gradient(145deg, rgba(45, 38, 15, 0.9), rgba(20, 17, 5, 0.95));
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 20px 40px -12px rgba(255, 215, 0, 0.25), 0 0 0 1px rgba(255, 215, 0, 0.15);
        }
        .sub-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(145deg, rgba(45, 38, 15, 0.9), rgba(20, 17, 5, 0.95));
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 12px 30px -10px rgba(255, 215, 0, 0.15);
        }
        .category-card::after, .sub-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 0;
        }
        .category-card:hover::after, .sub-card:hover::after {
            opacity: 1;
        }
        .card-image-container {
            width: 35%;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(255, 215, 0, 0.15);
            flex-shrink: 0;
            z-index: 2;
            height: 100%;
        }
        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .category-card:hover .card-image-container img,
        .sub-card:hover .card-image-container img {
            transform: scale(1.08);
        }
        .card-image-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.7));
        }
        .card-content-area {
            width: 65%;
            padding: 0.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.1rem;
            position: relative;
            z-index: 2;
            height: 100%;
        }
        .card-content-area h3, .card-content-area h4 {
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            font-size: 0.9rem;
            line-height: 1.2;
            font-weight: 700;
            color: #fff;
        }
        .card-content-area .price-tag {
            font-size: 0.7rem;
            font-weight: 700;
            color: #e6b800;
        }
        .card-content-area .sub-cat-name {
            font-size: 0.7rem;
            color: #bbb;
            font-weight: 500;
        }
        .card-content-area .cat-english {
            font-size: 0.65rem;
            color: #999;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        .text-gold-dark { color: #e6b800; }
        .text-gold-shine { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.15); }

        /* Project cards */
        .project-card {
            background: linear-gradient(145deg, rgba(30, 25, 10, 0.85), rgba(15, 12, 5, 0.95));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 20px 40px -12px rgba(255, 215, 0, 0.2);
        }
        .project-card .project-img {
            height: 180px;
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .project-card:hover .project-img {
            transform: scale(1.05);
        }

        /* Header - exactly from ai.html */
        .glass-header {
            margin: 1rem auto 0 auto; 
            border-radius: 50px; 
            width: calc(100% - 2rem);
            max-width: 900px; 
            background-color: #050505; 
            border: 3px solid #FFD700; 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem; 
            height: 70px; 
        }
        .golden-border-anim {
            animation: goldGlowPulse 2.5s infinite alternate ease-in-out;
        }
        @keyframes goldGlowPulse {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), inset 0 0 5px rgba(255, 215, 0, 0.2); }
            100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), inset 0 0 15px rgba(255, 215, 0, 0.5); }
        }
        .header-logo {
            height: 48px; width: 48px; object-fit: contain; border-radius: 12px; flex-shrink: 0;
        }
        .header-title-img {
            height: 32px; max-width: 50%; object-fit: contain; flex-grow: 1; margin: 0 1rem;
        }
        @media (max-width: 640px) {
            .glass-header { height: 60px; padding: 0.25rem 1rem; border-width: 2px; }
            .header-logo { height: 40px; width: 40px; }
            .header-title-img { height: 24px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.5); }

        /* Modal */
        .modal-gold {
            background: rgba(10, 10, 10, 0.94);
            backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 215, 0, 0.05);
        }
        #modal-container.hidden { opacity: 0; pointer-events: none; }
        #modal-container { transition: opacity 0.3s ease; }

        /* iPhone 12 Mini responsive */
        @media only screen and (max-width: 390px) {
            .category-card { height: 110px !important; min-height: 100px !important; }
            .sub-card { height: 100px !important; min-height: 88px !important; }
            .card-content-area h3, .card-content-area h4 { font-size: 0.75rem !important; }
            .card-content-area .price-tag { font-size: 0.6rem !important; }
            .card-content-area .sub-cat-name { font-size: 0.6rem !important; }
            .card-content-area .cat-english { font-size: 0.55rem !important; }
            .glass-header { height: 54px !important; padding: 0.25rem 0.75rem !important; }
            .header-logo { height: 34px !important; width: 34px !important; }
            .header-title-img { height: 20px !important; }
            .project-card .project-img { height: 140px !important; }
            body { padding-top: 68px !important; }
        }
        @media only screen and (max-width: 360px) {
            .category-card { height: 96px !important; min-height: 88px !important; }
            .sub-card { height: 88px !important; min-height: 80px !important; }
            .card-content-area { padding: 0.3rem 0.5rem; }
            .card-content-area h3, .card-content-area h4 { font-size: 0.65rem !important; }
            .card-content-area .price-tag { font-size: 0.55rem !important; }
            .card-content-area .sub-cat-name { font-size: 0.55rem !important; }
            .card-content-area .cat-english { font-size: 0.5rem !important; }
        }
    </style>
</head>

                    { name: 'App Promos', price: '₹1999', img: 'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Startup Pitch', price: '₹2499', img: 'https://images.unsplash.com/photo-1556761175-5973dc0f32b7?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Internal Training', price: '₹1499', img: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'animation',
                name: 'Animation / 3D',
                icon: 'fa-cube',
                image: 'sixsix.png',
                subcategories: [
                    { name: 'Pixar Style', price: '₹4999', img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Anime / Manga', price: '₹3999', img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Low Poly 3D', price: '₹2999', img: 'https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: '2D Explainer', price: '₹1999', img: 'https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Abstract Motion', price: '₹3499', img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'devotional',
                name: 'Devotional / Spiritual',
                icon: 'fa-om',
                image: 'sevenseven.png',
                subcategories: [
                    { name: 'Bhajans & Kirtans', price: '₹899', img: 'https://images.unsplash.com/photo-1579017308347-86be168a33fa?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Temple Tours', price: '₹1299', img: 'https://images.unsplash.com/photo-1514222046422-49fa5eb80b33?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Festival Greetings', price: '₹399', img: 'https://images.unsplash.com/photo-1533558701576-23c65e0272fb?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Spiritual Quotes', price: '₹299', img: 'https://images.unsplash.com/photo-1507692049790-de58290a4334?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Daily Darshan', price: '₹499', img: 'https://images.unsplash.com/photo-1605367375253-333e69bb0d81?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }, {
                id: 'shortfilm',
                name: 'Short Films',
                icon: 'fa-film',
                image: 'eighteight.png',
                subcategories: [
                    { name: 'Sci-Fi Shorts', price: '₹8999', img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Drama / Emotional', price: '₹4999', img: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Action Sequences', price: '₹9999', img: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Silent Films', price: '₹2999', img: 'https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                    { name: 'Documentary Style', price: '₹5999', img: 'https://images.unsplash.com/photo-1559100578-8318b760a005?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
                ]
            }];

            const projects = [{
                title: 'Cyberpunk 2077 Teaser',
                category: 'Animation',
                img: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }, {
                title: 'Brand Launch: NEXUS',
                category: 'Ad / Promo',
                img: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }, {
                title: 'Motivation: "Unstoppable"',
                category: 'Motivation',
                img: 'https://images.unsplash.com/photo-1552581234-26160f608093?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }, {
                title: 'Horror Short: "Echoes"',
                category: 'Horror',
                img: 'https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }, {
                title: 'Historical: "Spartan Rise"',
                category: 'Historical',
                img: 'https://images.unsplash.com/photo-1622322384735-86f78e4785bc?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }, {
                title: 'Real Estate Walkthrough',
                category: 'Corporate',
                img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=400&auto=format&fit=crop',
                videoId: defaultVideoId
            }];

            const grid = document.getElementById('category-grid');
            categories.forEach((cat, idx) => {
                const card = document.createElement('button');
                card.className = `category-card rounded-2xl p-0 flex items-stretch w-full text-left transition-all duration-300`;
                card.style.animationDelay = `${idx * 40}ms`;
                card.innerHTML = `
                    <div class="card-image-container">
                        <img src="${cat.image}" alt="${cat.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                    </div>
                    <div class="card-content-area">
                        <h3 class="font-playfair font-bold text-white/95 text-sm sm:text-base truncate">${cat.name}</h3>
                        <div class="flex items-center gap-2 text-[10px] sm:text-xs text-[#e6b800]/70 mt-0.5 font-montserrat font-medium">
                            <i class="fa-solid ${cat.icon} text-[#e6b800]/60"></i>
                            <span>${cat.subcategories.length} styles</span>
                        </div>
                    </div>
                    <div class="flex items-center pr-3 text-[#e6b800]/40">
                        <i class="fa-regular fa-chevron-right text-sm"></i>
                    </div>
                `;
                card.addEventListener('click', () => openModal(cat.id));
                grid.appendChild(card);
            });

            const projectGrid = document.getElementById('project-grid');
            projects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'project-card rounded-2xl overflow-hidden group relative flex flex-col';
                div.innerHTML = `
                    <div class="relative overflow-hidden">
                        <img src="${p.img}" alt="${p.title}" class="project-img w-full h-44 sm:h-48 object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <i class="fa-regular fa-circle-play text-5xl text-[#FFD700] drop-shadow-[0_0_30px_rgba(255,215,0,0.4)]"></i>
                        </div>
                        <div class="absolute bottom-3 left-3 right-3">
                            <span class="text-[10px] font-montserrat font-bold px-2 py-0.5 rounded-full uppercase tracking-wider" style="background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.15); color:#e6b800;">${p.category}</span>
                            <h4 class="text-white font-playfair font-bold text-sm mt-1.5 truncate">${p.title}</h4>
                        </div>
                    </div>
                `;
                div.addEventListener('click', () => {
                    openVideoModal(p.videoId || defaultVideoId, p.title);
                });
                projectGrid.appendChild(div);
            });

            // MODAL LOGIC
            const modalContainer = document.getElementById('modal-container');
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalContent = document.getElementById('modal-content');
            const closeModalBtn = document.getElementById('close-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalIcon = document.getElementById('modal-icon');
            const subList = document.getElementById('subcategory-list');

            const videoModalContainer = document.getElementById('video-modal-container');
            const videoModalBackdrop = document.getElementById('video-modal-backdrop');
            const videoModalContent = document.getElementById('video-modal-content');
            const closeVideoBtn = document.getElementById('close-video-modal');
            const youtubeIframe = document.getElementById('youtube-iframe');
            const videoModalTitle = document.getElementById('video-modal-title');

            window.openModal = (categoryId) => {
                const cat = categories.find(c => c.id === categoryId);
                if (!cat) return;
                modalTitle.textContent = cat.name;
                modalIcon.innerHTML = `<i class="fa-solid ${cat.icon} text-[#FFD700] text-lg"></i>`;

                subList.innerHTML = cat.subcategories.map((sub, i) => `
                    <button class="sub-card rounded-xl p-0 flex items-stretch w-full text-left transition-all" onclick="openVideoModal('${sub.videoId}', '${sub.name}')" style="animation-delay:${i*20}ms">
                        <div class="card-image-container">
                            <img src="${sub.img}" alt="${sub.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                        </div>
                        <div class="card-content-area">
                            <h4 class="font-playfair font-bold text-white/90 text-sm truncate">${sub.name}</h4>
                            <span class="price-tag text-[#e6b800] text-xs font-bold">${sub.price}</span>
                        </div>
                        <div class="flex items-center pr-3 text-[#e6b800]/40">
                            <i class="fa-regular fa-play text-sm"></i>
                        </div>
                    </button>
                `).join('');

                modalContainer.classList.remove('hidden');
                requestAnimationFrame(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                });
            };

            const closeModal = () => {
                modalContent.classList.remove('scale-100', 'opacity-100');
                modalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modalContainer.classList.add('hidden'), 300);
            };

            window.openVideoModal = (videoId, title) => {
                videoModalTitle.textContent = title || 'video';
                youtubeIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
                videoModalContainer.classList.remove('hidden');
                requestAnimationFrame(() => {
                    videoModalContent.classList.remove('scale-95', 'opacity-0');
                    videoModalContent.classList.add('scale-100', 'opacity-100');
                });
            };

            const closeVideoModal = () => {
                videoModalContent.classList.remove('scale-100', 'opacity-100');
                videoModalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    videoModalContainer.classList.add('hidden');
                    youtubeIframe.src = '';
                }, 300);
            };

            closeModalBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);
            closeVideoBtn.addEventListener('click', closeVideoModal);
            videoModalBackdrop.addEventListener('click', closeVideoModal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!videoModalContainer.classList.contains('hidden')) closeVideoModal();
                    else if (!modalContainer.classList.contains('hidden')) closeModal();
                }
            });
        })();
    </script>
</body>
</html>
