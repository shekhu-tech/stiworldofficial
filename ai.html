<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>STIWORLD — Professional AI Video Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Premium Fonts: Playfair Display for elegant headings, Montserrat for clean, visible body text -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#050505',
                            card: '#0a0a0a',
                            gold: '#FFD700',
                            goldDark: '#B8860B',
                            goldLight: '#FFE873'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%);
            color: #f8fafc;
            padding-top: 90px;
            padding-bottom: 120px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- SHINING GOLD PROFESSIONAL CARDS (Direct Video Play) ----- */
        .pro-card {
            background: linear-gradient(145deg, rgba(20, 18, 10, 0.8), rgba(10, 10, 10, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            overflow: hidden;
            border-radius: 16px;
            display: flex;
            align-items: stretch;
            text-align: left;
            width: 100%;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            height: 140px;
        }
        
        .pro-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 215, 0, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 1;
        }

        .pro-card:hover {
            transform: translateY(-5px);
            background: linear-gradient(145deg, rgba(30, 26, 12, 0.9), rgba(15, 14, 10, 0.95));
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 15px 35px -10px rgba(255, 215, 0, 0.25), 0 0 0 1px rgba(255, 215, 0, 0.2);
        }

        .pro-card:hover::before { opacity: 1; }

        .card-img-wrapper {
            width: 40%;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 2;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }
        .pro-card:hover .card-img-wrapper img { transform: scale(1.1); }
        
        .card-img-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(10, 10, 10, 1) 95%);
        }

        .card-info {
            width: 60%;
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .play-icon-overlay {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .pro-card:hover .play-icon-overlay {
            opacity: 1;
            transform: translateY(-50%) scale(1);
            background: #FFD700;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        /* Gold Header Redesign */
        .glass-header-pro {
            margin: 1rem auto 0 auto; 
            border-radius: 100px; 
            width: calc(100% - 2rem);
            max-width: 900px; 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2); 
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem; 
            height: 70px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .gold-glow {
            animation: goldPulse 3s infinite alternate ease-in-out;
        }
        
        @keyframes goldPulse {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.1), inset 0 0 0 rgba(255, 215, 0, 0); border-color: rgba(255, 215, 0, 0.2); }
            100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.5); }
        }

        .header-logo { height: 44px; width: 44px; object-fit: contain; border-radius: 12px; flex-shrink: 0; }
        .header-title-img { height: 28px; max-width: 50%; object-fit: contain; flex-grow: 1; margin: 0 1rem; filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255,215,0,0.5)); opacity: 0.9; }

        /* Project Vault */
        .project-item {
            background: #0a0a0a;
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        .project-item:hover {
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px rgba(255, 215, 0, 0.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.6); }

        /* Mobile specific fixes */
        @media (max-width: 640px) {
            .glass-header-pro { height: 60px; padding: 0.25rem 1rem; }
            .header-logo { height: 36px; width: 36px; }
            .header-title-img { height: 20px; }
            .pro-card { height: 120px; }
            .card-info { padding: 0.75rem; }
            .play-icon-overlay { width: 32px; height: 32px; font-size: 0.8rem; right: 0.75rem; }
        }
    </style>
</head>
<body class="font-sans">

    <header class="glass-header-pro gold-glow">
        <img class="header-logo" src="sti.png" alt="Logo" onerror="this.src='https://placehold.co/48x48/FFD700/000000?text=S'">
        <img class="header-title-img" src="stin.png" alt="STIWORLD" onerror="this.style.display='none'">
        <img class="header-logo" src="sti.png" alt="Logo" onerror="this.src='https://placehold.co/48x48/B8860B/000000?text=W'">
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 z-10 relative">
        <div class="flex flex-col items-center text-center mb-12 mt-4">
            <h1 class="text-4xl sm:text-6xl font-black font-serif mt-4 leading-tight tracking-tight text-white">
                Future of <span class="bg-gradient-to-r from-yellow-200 via-yellow-400 to-yellow-600 bg-clip-text text-transparent drop-shadow-[0_0_25px_rgba(255,215,0,0.3)]">Creation</span>
            </h1>
            <p class="text-sm sm:text-base text-gray-400 max-w-2xl mt-4 font-medium tracking-wide">
                Hyper-realistic, studio-quality AI video generation. High conversion visuals from 15 seconds to 60 minutes.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-16" id="category-grid"></div>

        <section class="mt-8 pt-8 border-t border-yellow-500/20">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-yellow-500/10 flex items-center justify-center border border-yellow-500/30">
                        <i class="fa-solid fa-layer-group text-yellow-400 text-lg drop-shadow-[0_0_5px_rgba(255,215,0,0.5)]"></i>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-bold font-serif text-white tracking-tight">Project Vault</h2>
                </div>
                <span class="inline-flex items-center gap-2 text-xs font-bold text-yellow-400 bg-yellow-400/10 px-4 py-2 rounded-full border border-yellow-400/30 uppercase tracking-widest self-start sm:self-auto">
                    <i class="fa-solid fa-play"></i> Tap to play
                </span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6" id="project-grid"></div>
        </section>

        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40">
            <a href="https://wa.me/918395913829" target="_blank" class="flex items-center justify-center gap-4 w-full py-4 px-6 rounded-full text-white transition-all group overflow-hidden relative" style="background: rgba(15, 12, 5, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.4); box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.2);">
                <div class="absolute inset-0 bg-gradient-to-r from-yellow-500/10 to-yellow-700/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <i class="fa-brands fa-whatsapp text-2xl text-yellow-400 z-10 drop-shadow-[0_0_8px_rgba(255,215,0,0.5)]"></i>
                <span class="font-sans font-bold text-[14px] tracking-widest z-10">START YOUR PROJECT</span>
                <i class="fa-solid fa-arrow-right text-yellow-400/70 group-hover:translate-x-2 transition-transform duration-300 z-10"></i>
            </a>
        </div>
    </main>

    <div id="video-modal-container" class="fixed inset-0 z-[70] flex items-center justify-center p-4 hidden">
        <div id="video-modal-backdrop" class="absolute inset-0 bg-black/95 backdrop-blur-md"></div>
        <div id="video-modal-content" class="relative w-full max-w-[400px] aspect-[9/16] bg-brand-card rounded-[2rem] border border-yellow-500/30 shadow-[0_0_50px_rgba(255,215,0,0.15)] transform scale-95 opacity-0 transition-all duration-300 overflow-hidden flex flex-col">
            
            <div class="absolute top-0 left-0 right-0 p-5 bg-gradient-to-b from-black/90 to-transparent z-20 flex justify-between items-start pointer-events-none">
                <h3 id="video-modal-title" class="text-white font-bold text-xl font-serif drop-shadow-lg pr-12">Video</h3>
            </div>
            
            <button id="close-video-modal" class="absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/60 hover:bg-yellow-500/20 flex items-center justify-center text-white hover:text-yellow-400 transition-all border border-yellow-500/20 backdrop-blur-sm">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="w-full h-full flex-grow relative bg-black">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                    <i class="fa-solid fa-circle-notch fa-spin text-yellow-500/30 text-4xl"></i>
                </div>
                <iframe id="youtube-iframe" class="absolute inset-0 w-full h-full z-10" src="" title="Video Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <div class="absolute bottom-6 left-0 right-0 flex justify-center z-20">
                <a href="https://wa.me/918395913829" target="_blank" class="bg-black/70 backdrop-blur-md border border-yellow-500/50 text-white px-8 py-3 rounded-full font-bold font-sans text-sm flex items-center gap-3 hover:bg-yellow-500/20 transition-all shadow-[0_0_20px_rgba(255,215,0,0.2)]">
                    <i class="fa-brands fa-whatsapp text-yellow-400 text-lg"></i> ORDER SIMILAR
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const defaultVideoId = 'dQw4w9WgXcQ'; // Fallback sample ID

            // EXACTLY 15 CATEGORIES as requested
            const categories = [
                { id: 'horror', name: 'Horror & Thriller', price: 'Starts at ₹499', icon: 'fa-ghost', image: 'oneone.png', fallback: 'https://youtube.com/shorts/B8dirBSDiak?si=jcWFdiGZ7cp0j69O', videoId: defaultVideoId },
                { id: 'historical', name: 'History & Mythology', price: 'Starts at ₹999', icon: 'fa-landmark', image: 'twotwo.png', fallback: 'https://images.unsplash.com/photo-1622322384735-86f78e4785bc?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'motivational', name: 'Motivation & Fitness', price: 'Starts at ₹399', icon: 'fa-bolt', image: 'threethree.png', fallback: 'https://images.unsplash.com/photo-1552581234-26160f608093?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'product', name: 'Product Promo', price: 'Starts at ₹799', icon: 'fa-box-open', image: 'fourfour.png', fallback: 'https://images.unsplash.com/photo-1498049794561-7780e7231661?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'corporate', name: 'Corporate Business', price: 'Starts at ₹1499', icon: 'fa-building', image: 'fivefive.png', fallback: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'animation', name: '3D Animation', price: 'Starts at ₹1999', icon: 'fa-cube', image: 'sixsix.png', fallback: 'https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'devotional', name: 'Devotional Vibe', price: 'Starts at ₹299', icon: 'fa-om', image: 'sevenseven.png', fallback: 'https://images.unsplash.com/photo-1579017308347-86be168a33fa?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'shortfilm', name: 'Cinematic Shorts', price: 'Starts at ₹2999', icon: 'fa-film', image: 'eighteight.png', fallback: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                // Added Categories
                { id: 'webseries', name: 'Web Series', price: 'Starts at ₹4999', icon: 'fa-tv', image: 'ninenine.png', fallback: 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'film', name: 'Feature Film', price: 'Starts at ₹9999', icon: 'fa-clapperboard', image: 'tenten.png', fallback: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'musicvideo', name: 'Music Videos', price: 'Starts at ₹1999', icon: 'fa-music', image: 'eleveneleven.png', fallback: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'documentary', name: 'Documentaries', price: 'Starts at ₹3499', icon: 'fa-video', image: 'twelvetwelve.png', fallback: 'https://images.unsplash.com/photo-1559100578-8318b760a005?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'scifi', name: 'Sci-Fi & Fantasy', price: 'Starts at ₹3999', icon: 'fa-rocket', image: 'thirteenthirteen.png', fallback: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'comedy', name: 'Comedy Sketches', price: 'Starts at ₹899', icon: 'fa-masks-theater', image: 'fourteenfourteen.png', fallback: 'https://images.unsplash.com/photo-1585699324551-f6c309eedeca?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { id: 'wedding', name: 'Wedding Cinematic', price: 'Starts at ₹2499', icon: 'fa-ring', image: 'fifteenfifteen.png', fallback: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
            ];

            const projects = [
                { title: 'Cyberpunk Teaser', category: 'Animation', img: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { title: 'NEXUS Launch', category: 'Commercial', img: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { title: 'Unstoppable Will', category: 'Fitness', img: 'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { title: 'Echoes of Past', category: 'Horror', img: 'https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { title: 'Spartan Rise', category: 'History', img: 'https://images.unsplash.com/photo-1622322384735-86f78e4785bc?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId },
                { title: 'Skyline Estates', category: 'Real Estate', img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=400&auto=format&fit=crop', videoId: defaultVideoId }
            ];

            const grid = document.getElementById('category-grid');
            categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = `pro-card group`;
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${cat.image}" alt="${cat.name}" onerror="this.onerror=null; this.src='${cat.fallback}';">
                    </div>
                    <div class="card-info">
                        <div class="flex items-center gap-2 mb-1.5 text-yellow-500">
                            <i class="fa-solid ${cat.icon} text-sm"></i>
                            <span class="text-[10px] font-bold tracking-widest uppercase opacity-90">Premium</span>
                        </div>
                        <h3 class="font-serif font-bold text-white text-lg leading-tight mb-1 pr-6 group-hover:text-yellow-400 transition-colors">${cat.name}</h3>
                        <p class="text-gray-400 text-xs font-semibold">${cat.price}</p>
                        
                        <div class="play-icon-overlay">
                            <i class="fa-solid fa-play ml-1 text-sm"></i>
                        </div>
                    </div>
                `;
                // Direct Video Trigger on click
                card.addEventListener('click', () => openVideoModal(cat.videoId, cat.name));
                grid.appendChild(card);
            });

            const projectGrid = document.getElementById('project-grid');
            projects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'project-item group';
                div.innerHTML = `
                    <div class="relative overflow-hidden h-48 sm:h-56">
                        <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/50 to-transparent"></div>
                        
                        <!-- Hover Play Button -->
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <div class="w-14 h-14 rounded-full bg-yellow-500/20 border border-yellow-400 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(255,215,0,0.4)]">
                                <i class="fa-solid fa-play text-yellow-400 text-xl ml-1"></i>
                            </div>
                        </div>
                        
                        <div class="absolute bottom-4 left-4 right-4 z-10">
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 backdrop-blur-md uppercase tracking-wider mb-2 inline-block">${p.category}</span>
                            <h4 class="text-white font-serif font-bold text-lg truncate drop-shadow-md group-hover:text-yellow-200 transition-colors">${p.title}</h4>
                        </div>
                    </div>
                `;
                div.addEventListener('click', () => openVideoModal(p.videoId, p.title));
                projectGrid.appendChild(div);
            });

            const videoModalContainer = document.getElementById('video-modal-container');
            const videoModalBackdrop = document.getElementById('video-modal-backdrop');
            const videoModalContent = document.getElementById('video-modal-content');
            const closeVideoBtn = document.getElementById('close-video-modal');
            const youtubeIframe = document.getElementById('youtube-iframe');
            const videoModalTitle = document.getElementById('video-modal-title');

            window.openVideoModal = (videoId, title) => {
                videoModalTitle.textContent = title || 'Video Output';
                youtubeIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
                videoModalContainer.classList.remove('hidden');
                
                requestAnimationFrame(() => {
                    videoModalContent.classList.remove('scale-95', 'opacity-0');
                    videoModalContent.classList.add('scale-100', 'opacity-100');
                });
            };

            const closeVideoModal = () => {
                videoModalContent.classList.remove('scale-100', 'opacity-100');
                videoModalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    videoModalContainer.classList.add('hidden');
                    youtubeIframe.src = ''; // Stop playback
                }, 300);
            };

            closeVideoBtn.addEventListener('click', closeVideoModal);
            videoModalBackdrop.addEventListener('click', closeVideoModal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !videoModalContainer.classList.contains('hidden')) {
                    closeVideoModal();
                }
            });
        })();
    </script>
</body>
</html>
